# ---------- Bell ----------
setw -g monitor-bell on
set -g visual-bell off
set -g window-status-bell-style "bg=red,fg=white,blink"

# ---------- Prefix ----------
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ---------- Splits & windows ----------
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %
bind -n M-n next-window
bind -n M-p previous-window
bind-key R join-pane -t '{marked}'

set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 90000
set -sg escape-time 0

# ---------- Shell ----------
set -g default-shell /bin/zsh
set -g default-command /bin/zsh

# ---------- Status bar ----------
set -g status-interval 5
set -g status-left "[#S] "
set -g status-left-length 30
set -g status-right "#[fg=navy,bold]#(/usr/local/bin/tmux-vpn-ip.sh)#[default] | %H:%M "
set -g status-right-length 80

# ---------- Mouse & clipboard ----------
set -g mouse on
set -g set-clipboard on
setw -g mode-keys vi

# Send copies to the system clipboard (Wayland or X11)
if-shell '[ -n "$WAYLAND_DISPLAY" ]' \
  'set -g copy-command "wl-copy"' \
  'set -g copy-command "xclip -selection clipboard -in"'

# Drag with the mouse: copy on release, keep the highlight
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear

# Double-click = copy word, triple-click = copy line
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send -X select-word \; send -X copy-pipe-no-clear
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send -X select-line \; send -X copy-pipe-no-clear
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear

# Keyboard copy in copy mode: v to start, y to copy (like vim)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ---------- Plugins (keep last) ----------
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux